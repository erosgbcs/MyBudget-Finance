<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBudget-Finance</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1976d2">
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 MyBudget-Finance</h1>
            <button id="theme-toggle" class="theme-toggle">🌙</button>
        </header>

        <!-- Accounts Section -->
        <div class="section glass">
            <h2>💳 Accounts</h2>
            <div id="accounts-list"></div>
            <div class="add-account">
                <input type="text" id="new-account-name" placeholder="New account name">
                <button id="add-account-btn" class="btn">+ Add Account</button>
            </div>
        </div>

        <!-- Savings Goals Section -->
        <div class="section glass">
            <h2>🎯 Savings Goals</h2>
            <div class="row">
                <input type="text" id="savings-name" placeholder="Goal name">
                <input type="number" id="savings-target" placeholder="Target amount" step="0.01">
                <input type="number" id="savings-current" placeholder="Already saved" step="0.01">
                <button id="add-savings-btn" class="btn">+ Add Goal</button>
            </div>
            <div id="savings-list"></div>
        </div>

        <!-- Loans Section -->
        <div class="section glass">
            <h2>🏦 Loans</h2>
            <div class="row">
                <input type="text" id="loan-name" placeholder="Loan description">
                <input type="number" id="loan-amount" placeholder="Amount" step="0.01">
                <select id="loan-type">
                    <option value="borrowed">I Owe (Borrowed)</option>
                    <option value="lent">Owed to Me (Lent)</option>
                </select>
                <button id="add-loan-btn" class="btn">+ Add Loan</button>
            </div>
            <div id="loans-list"></div>
        </div>

        <!-- Summary Cards -->
        <div class="summary">
            <div class="card glass balance">
                <p>Total Balance</p>
                <h2 id="balance">₱0.00</h2>
            </div>
            <div class="card glass income">
                <p>Income (This Month)</p>
                <h3 id="total-income">₱0.00</h3>
            </div>
            <div class="card glass expense">
                <p>Expenses (This Month)</p>
                <h3 id="total-expense">₱0.00</h3>
            </div>
        </div>

        <!-- Add Transaction Form -->
        <div class="section glass">
            <h2>Add Transaction</h2>
            <input type="text" id="description" placeholder="Description">
            <input type="number" id="amount" placeholder="Amount" step="0.01">
            <div class="row">
                <select id="type">
                    <option value="expense">Expense</option>
                    <option value="income">Income</option>
                </select>
                <select id="category">
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Health">Health</option>
                    <option value="Salary">Salary</option>
                    <option value="Other Income">Other Income</option>
                    <option value="Other">Other</option>
                </select>
                <select id="account">
                    <!-- Populated dynamically -->
                </select>
            </div>
            <button id="add-transaction-btn" class="btn">Add Transaction</button>
        </div>

        <!-- Budget Allocation Section -->
        <div class="section glass">
            <h2>📊 Monthly Budget Allocation</h2>
            <p>Set budgets for expense categories (current month)</p>
            <div class="row">
                <select id="budget-category">
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Health">Health</option>
                    <option value="Other">Other</option>
                </select>
                <input type="number" id="budget-amount" placeholder="Budget limit" step="0.01">
                <button id="set-budget-btn" class="btn">Set</button>
            </div>
            <div id="budget-progress"></div>
        </div>

        <!-- Transactions List -->
        <div class="section glass">
            <h2>Recent Transactions</h2>
            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="income">Income</button>
                <button class="filter-btn" data-filter="expense">Expenses</button>
            </div>
            <ul id="transaction-list" class="transaction-list"></ul>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => console.log('Service Worker registered'))
                    .catch(err => console.log('Service Worker error:', err));
            });
        }
    </script>
</body>
</html>
